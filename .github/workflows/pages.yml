# Publish site/ to GitHub Pages.
#
# The site is one self-contained HTML file — no build step, no dependencies, no
# external requests at runtime. So this workflow uploads the directory as-is.
#
# Requires Settings → Pages → Source = "GitHub Actions" on the repository. That
# is a one-time click; without it the deploy job fails with a 404.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel a deploy that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against external requests
        # The page must stay self-contained: no CDN scripts, no remote fonts, no
        # tracking pixels. This checks the things that actually *fetch* — src
        # attributes, CSS url()/@import, and <link> rels that load.
        #
        # Deliberately NOT every absolute URL. Anchors to GitHub and a
        # rel="canonical" are navigation and metadata; they cost the visitor no
        # request. An earlier version of this grepped all href= and failed the
        # build on its own canonical link.
        run: |
          set -uo pipefail
          fail=0
          check() { # description, pattern
            if grep -nEi "$2" site/index.html; then
              echo "::error::$1"
              fail=1
            fi
          }
          check "external src= (script, image, iframe or media)" 'src="https?://'
          check "external url() in CSS"                          'url\((["'"'"'])?https?://'
          check "@import in CSS"                                 '@import'
          check "external <link> that fetches"                   '<link[^>]+rel="(stylesheet|preload|prefetch|preconnect|dns-prefetch|modulepreload)"[^>]*href="https?://'
          if [ "$fail" -ne 0 ]; then
            echo "site/index.html would load something from another host"
            exit 1
          fi
          echo "self-contained: nothing is fetched from another host"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
